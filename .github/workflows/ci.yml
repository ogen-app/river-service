name: ci

# Lint and test on every PR and push to main; after the tests pass, a push to
# main builds and pushes the image to GHCR.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same PR. Each push to main gets a group of its
# own, so no main run is cancelled or replaced while waiting, and every green
# merge publishes its image.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: forbid stdlib log.Print calls
        run: |
          if git grep -nE 'log\.Print(ln|f)?\(' -- cmd internal; then
            echo "::error::use log/slog, not the stdlib log.Print/Printf/Println functions"
            exit 1
          fi
      # gofmt, goimports and go vet run inside golangci-lint (.golangci.yml).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.14

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: river
          POSTGRES_PASSWORD: river
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U river"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      # TEST_DATABASE_DSN turns on the tests that need Postgres (River's schema,
      # the step loop, job service); without it they skip.
      - name: go test
        run: go test -race ./...
        env:
          TEST_DATABASE_DSN: postgres://river:river@localhost:5432/postgres?sslmode=disable

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install protoc-gen-go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify generated code is up to date
        run: |
          make proto
          if [ -n "$(git status --porcelain -- gen/)" ]; then
            echo "::error::gen/ is out of date — run 'make proto' and commit the result"
            git diff -- gen/
            exit 1
          fi

  # Every green main push publishes ghcr.io/ogen-app/river-service:<build>,
  # where build is the commit count on main, then asks ogen-release to bump
  # river-service to it.
  build-push:
    runs-on: ubuntu-latest
    needs: [lint, test, proto]
    if: github.event_name == 'push' && github.repository_owner == 'ogen-app'
    # Runs of back-to-back merges can publish out of order: build 101 may push
    # and dispatch before build 100. Each build has its own tag, so the
    # registry doesn't care, and ogen-release ignores a bump to a build lower
    # than the one it holds.
    permissions:
      contents: read
      packages: write
    steps:
      # Full history: the build number is the commit count, which a shallow
      # clone reports as 1.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build number
        id: build
        run: echo "number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The source label links the package to this repo, which is what lets
      # GITHUB_TOKEN push to it.
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ogen-app/river-service:${{ steps.build.outputs.number }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/ogen-app/river-service
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Best effort: a missing ogen-release repo or token must not fail main.
      - name: Dispatch bump to ogen-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
          BUILD: ${{ steps.build.outputs.number }}
        run: |
          gh api repos/ogen-app/ogen-release/dispatches \
            -f event_type=bump \
            -f 'client_payload[service]=river-service' \
            -F "client_payload[build]=$BUILD" \
            -f "client_payload[revision]=$GITHUB_SHA"
